[package]
name = "stet"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Keep Markdown knowledge repos in shape: one shared lint setup, the house rules, the inbox"
repository = "https://github.com/gshaw/stet"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
clap_usage = "5.0.0"
globset = "0.4.20"
ignore = "0.4.33"
jiff = "0.2.37"
miette = "7.6.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
insta = { version = "1.48.0", features = ["json", "redactions", "filters"] }
tempfile = "3.27.0"
