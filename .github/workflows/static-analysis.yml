# Every PR and push to main: the checks the pre-commit hook runs, on the whole repo, plus
# the tests. The released stet checks the docs and spelling, not this working copy.
name: Static analysis
on:
  pull_request:
  push:
    branches: [main]
# A new push to a PR cancels its older run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --quiet -- -D warnings
      - run: cargo test
      - run: stet check --check-only
  # The Linux release target, built as release.yml builds it, so a broken cross-compile
  # shows up before a tag. The Mac target is built by `mise run publish`.
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo build --release --target x86_64-unknown-linux-musl
      - run: ./target/x86_64-unknown-linux-musl/release/stet --version
